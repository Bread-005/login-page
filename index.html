<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" crossorigin="anonymous" href="https://core.ontavio.de/font-awesome/6.4.0/css/all.min.css"/>
    <title>Login</title>
</head>
<body>

<div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p>Waiting for server ...</p>
</div>

<div class="login" style="display: none;">
    <h1>Login Page</h1>
    <div class="input-div">
        <div class="input-row">
            <label for="username-input">Enter Username</label>
            <input id="username-input">
        </div>
        <div class="input-row">
            <label for="password-input">Enter Password</label>
            <input id="password-input" type="password">
        </div>
        <div id="confirm-password-row" class="input-row">
            <label for="confirm-password-input">Confirm Password</label>
            <input id="confirm-password-input" type="password">
        </div>
    </div>
    <button id="login-page-login-button">Login / Sign Up</button>
    <p id="login-message"></p>
    <div class="redirect-div">
        <div id="clocktower-homebrew-collection-button" class="project-link">
            <img src="icons/clocktower-homebrew-collection.png" alt="Clocktower Homebrew Collection icon">
            <span>Clocktower Homebrew Collection</span>
        </div>
        <button id="grimoire-of-lies-button">Grimoire of Lies</button>
        <button id="rock-paper-scissors-advanced-button">Rock Paper Scissors Advanced</button>
<!--        <button id="wherewolf-button">Wherewolf</button>-->
    </div>
</div>

<script src="login.js" type="module" defer></script>
</body>
</html>
